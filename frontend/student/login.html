<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Result | DURABON</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/update v0.0.1.css">
<link rel="stylesheet" href="../css/enhance.css">
</head>
<body class="login-body"><main class="login-card"><a class="brand dark-brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ACADEMY</small></span></a><p class="kicker">STUDENT RESULT PORTAL</p><h1>Enter your details.</h1>
<p id="picked"></p>
<form id="studentLogin">
  <label>Student ID<input id="studentId" placeholder="e.g. DUR-2026-0001" autocapitalize="characters" autocomplete="username" required></label>
  <label>Password / PIN<input id="studentPassword" type="password" placeholder="Password or PIN" autocomplete="current-password" required></label>
  <button class="btn gold" type="submit">Check Result →</button>
</form>
<a class="back" href="select.html">← Change term or class</a></main>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
const selection = JSON.parse(sessionStorage.getItem('resultSelection') || 'null');
if (!selection) location.href = 'select.html';
else picked.textContent = selection.term + ' · ' + selection.className;

studentLogin.addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await Durabon.api('/auth/student-login', { method: 'POST', body: { studentId: studentId.value.trim(), password: studentPassword.value, className: selection.className } });
    localStorage.setItem('studentToken', d.token);
    localStorage.setItem('student', JSON.stringify(d.student));
    localStorage.setItem('resultTerm', selection.term);
    location.href = 'result.html?term=' + encodeURIComponent(selection.term);
  } catch (err) {
    alert(err.message);
  }
});
</script>
</body></html>
