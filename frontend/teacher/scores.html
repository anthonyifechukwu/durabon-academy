<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Scores | DURABON</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/enhance.css">
</head>
<body><header class="header"><a class="brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ACADEMY</small></span></a><a class="gold-pill" href="dashboard.html">← Dashboard</a></header>
<main class="section">
<p class="kicker">SCORE ENTRY</p><h1>Upload subject scores.</h1>
<p>Choose one of your assigned class/subject pairs, then submit each student's CA1, CA2 and exam.</p>

<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:20px">
  <label style="display:flex;flex-direction:column;gap:8px">Class &amp; Subject
    <select id="assignment" style="padding:11px 14px;border-radius:12px;border:1px solid var(--line)"></select>
  </label>
  <label style="display:flex;flex-direction:column;gap:8px">Term
    <select id="term" style="padding:11px 14px;border-radius:12px;border:1px solid var(--line)">
      <option>1st Term</option><option>2nd Term</option><option selected>3rd Term</option>
    </select>
  </label>
  <label style="display:flex;flex-direction:column;gap:8px">Session
    <input id="session" value="2026/2027" style="padding:11px 14px;border-radius:12px;border:1px solid var(--line)">
  </label>
</div>

<div class="table-wrap" style="overflow:auto;margin-top:25px">
  <table id="students" class="result-table" style="width:100%;min-width:700px;border-collapse:collapse">
    <thead><tr><th>Student</th><th>CA1 (/20)</th><th>CA2 (/20)</th><th>Exam (/60)</th><th>Save</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
</main>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
if (!localStorage.getItem('teacherToken')) location.href = 'login.html';
let assignments = [];

async function init() {
  const t = await Durabon.api('/teacher/me', { tokenKey: 'teacherToken' });
  assignments = t.assignedClasses || [];
  if (!assignments.length) {
    document.querySelector('main').insertAdjacentHTML('beforeend', '<p style="color:var(--muted)">You have no assigned classes yet. Contact the admin.</p>');
    return;
  }
  assignment.innerHTML = assignments.map((a, i) => `<option value="${i}">${a.className} — ${a.subject}</option>`).join('');
  loadStudents();
}
assignment && assignment.addEventListener && document.addEventListener('change', e => { if (e.target.id === 'assignment') loadStudents(); });

async function loadStudents() {
  const a = assignments[assignment.value];
  if (!a) return;
  const list = await Durabon.api('/teacher/students?className=' + encodeURIComponent(a.className), { tokenKey: 'teacherToken' });
  document.querySelector('#students tbody').innerHTML = list.map(s => `
    <tr>
      <td>${s.name}</td>
      <td><input id="a${s._id}" type="number" min="0" max="20"></td>
      <td><input id="b${s._id}" type="number" min="0" max="20"></td>
      <td><input id="c${s._id}" type="number" min="0" max="60"></td>
      <td><button class="btn gold small" onclick="save('${s._id}')">Save</button></td>
    </tr>`).join('') || '<tr><td colspan="5">No students found in this class yet.</td></tr>';
}

async function save(id) {
  const a = assignments[assignment.value];
  const body = {
    studentId: id, subject: a.subject, term: term.value, session: session.value,
    ca1: +document.getElementById('a' + id).value || 0,
    ca2: +document.getElementById('b' + id).value || 0,
    exam: +document.getElementById('c' + id).value || 0
  };
  try {
    const d = await Durabon.api('/teacher/scores', { method: 'POST', tokenKey: 'teacherToken', body });
    alert(d.message);
  } catch (x) { alert(x.message); }
}

init().catch(() => location.href = 'login.html');
</script>
</body></html>
