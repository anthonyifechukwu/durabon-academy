<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Messages | DURABON</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/enhance.css">
</head>
<body>
<header class="header">
  <a class="brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ACADEMY</small></span></a>
  <a class="gold-pill" href="dashboard.html">← Dashboard</a>
</header>
<main class="section">
  <p class="kicker">MESSAGES</p>
  <h1>Messages from the school</h1>
  <div id="log" style="margin-top:20px"></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
if (!localStorage.getItem('teacherToken')) location.href = 'login.html';

function timeAgo(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

Durabon.api('/teacher/messages', { tokenKey: 'teacherToken' }).then(msgs => {
  log.innerHTML = msgs.map(m => `
    <div class="teacher-row" style="align-items:flex-start;flex-direction:column;gap:4px">
      <div style="display:flex;justify-content:space-between;width:100%;gap:10px">
        <b>${m.subject}</b><small style="color:var(--muted);white-space:nowrap">${timeAgo(m.createdAt)}</small>
      </div>
      <span class="pill" style="background:${m.teacherId ? '#eef1f6' : '#fbeee0'};color:${m.teacherId ? '#33475b' : '#9a5b14'}">${m.teacherId ? 'Just for you' : 'To all teachers'}</span>
      <p style="margin:4px 0 0;font-size:13.5px;color:#333">${m.body}</p>
    </div>`).join('') || '<p style="color:var(--muted)">No messages yet.</p>';
}).catch(() => location.href = 'login.html');
</script>
</body>
</html>
