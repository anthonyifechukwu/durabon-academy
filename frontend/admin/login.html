<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | DURABON</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/update v0.0.1.css">
<link rel="stylesheet" href="../css/enhance.css">
</head>
<body class="login-body"><main class="login-card"><a class="brand dark-brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ACADEMY</small></span></a><p class="kicker">ADMINISTRATION</p><h1>Admin sign in.</h1><form id="login"><label>Admin ID<input id="id" required placeholder="admin"></label><label>Password<input id="pw" type="password" required></label><button class="btn gold">Sign In →</button></form><a class="back" href="../index.html">← Back</a></main>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
login.addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await Durabon.api('/auth/admin-login', { method: 'POST', body: { username: id.value, password: pw.value } });
    localStorage.setItem('adminToken', d.token);
    location.href = 'dashboard.html';
  } catch (x) { alert(x.message); }
});
</script>
</body></html>
