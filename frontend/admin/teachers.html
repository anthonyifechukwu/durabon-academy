<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers | DURABON</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/update v0.0.1.css">
<link rel="stylesheet" href="../css/enhance.css">
</head>
<body><header class="header"><a class="brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ADMIN</small></span></a><a class="gold-pill" href="dashboard.html">← Dashboard</a></header>
<main class="section">
<p class="kicker">TEACHERS</p><h1>Add a teacher</h1>
<p>Pick a class, then add the teacher. To give an existing teacher more classes or subjects, set class teachers, or remove a subject or class, use <a href="assignments.html" style="color:var(--gold);font-weight:700">Teacher assignments →</a></p>

<div id="classButtons" class="class-grid"></div>

<div id="classPanel" class="class-panel" style="display:none">
  <h2 id="panelTitle"></h2>
  <form id="addForm" style="max-width:560px">
    <label>Teacher Name<input id="fullName" required></label>
    <label>Email (optional)<input id="email" type="email"></label>
    <label>Phone Number<input id="phone" type="tel" placeholder="e.g. 08012345678" required></label>
    <label>Subject<input id="subject" placeholder="e.g. Mathematics" required></label>
    <button class="btn gold">Add Teacher</button>
    <p id="addOut"></p>
  </form>
</div>

<h2 style="margin-top:34px" id="listTitle">Teachers</h2>
<input class="search-bar" id="search" placeholder="Search teachers by name, ID, class or subject…">
<div id="list"></div>
</main>
<script src="../js/config.js"></script>
<script src="../js/classes.js"></script>
<script src="../js/app.js"></script>
<script>
if (!localStorage.getItem('adminToken')) location.href = 'login.html';
let teacherCache = [], selectedClass = null;

renderClassButtons(classButtons, c => {
  selectedClass = c;
  panelTitle.textContent = 'New teacher — ' + c;
  classPanel.style.display = 'block';
  addOut.textContent = '';
  draw();
});

function draw() {
  const q = search.value.trim().toLowerCase();
  const has = (v) => String(v || '').toLowerCase().includes(q);
  let rows, title;
  if (q) {                                   // searching looks across every class
    rows = teacherCache.filter(t => has(t.name) || has(t.teacherId) || (t.assignedClasses || []).some(a => has(a.className) || has(a.subject)));
    title = 'Search results';
  } else if (selectedClass) {                // otherwise only the class that was clicked
    rows = teacherCache.filter(t => (t.assignedClasses || []).some(a => a.className === selectedClass) || (t.classTeacherOf || []).includes(selectedClass));
    title = 'Teachers in ' + selectedClass;
  } else {
    listTitle.textContent = 'Teachers';
    list.innerHTML = '<p style="color:var(--muted)">Select a class above to see its teachers, or type in the search box.</p>';
    return;
  }
  listTitle.textContent = title + ' (' + rows.length + ')';
  list.innerHTML = '<div class="table-wrap" style="overflow:auto"><table class="result-table" style="width:100%;border-collapse:collapse">' +
    '<tr><th>Name</th><th>Teacher ID</th><th>Phone</th><th>Email</th><th>Password</th><th>Classes &amp; Subjects</th><th>Class Teacher Of</th><th>Status</th><th>Action</th></tr>' +
    (rows.map(t => {
      const mine = (t.assignedClasses || []).filter(a => q || a.className === selectedClass);
      return `<tr>
      <td>${t.name || '—'}</td><td>${t.teacherId}</td><td>${t.phone || '—'}</td><td>${t.email || '—'}</td><td>${t.initialPassword}</td>
      <td>${(mine.length ? mine : (t.assignedClasses || [])).map(a => `${a.className} · ${a.subject}`).join('<br>') || '—'}</td>
      <td>${(t.classTeacherOf || []).join(', ') || '—'}</td>
      <td><span class="pill ${t.status}">${t.status}</span></td>
      <td style="white-space:nowrap">
        <button class="btn small ${t.status === 'active' ? 'ghost' : 'gold'}" onclick="toggleStatus('${t._id}','${t.status}')">${t.status === 'active' ? 'Suspend' : 'Activate'}</button>
        <button class="btn small danger" onclick="removeTeacher('${t._id}')">Delete</button>
      </td>
    </tr>`; }).join('') || '<tr><td colspan="7">No teachers found.</td></tr>') + '</table></div>';
}

async function load() { teacherCache = await Durabon.api('/admin/teachers', { tokenKey: 'adminToken' }); draw(); }
search.addEventListener('input', draw);

async function toggleStatus(id, current) {
  await Durabon.api(`/admin/teachers/${id}/status`, { method: 'PATCH', body: { status: current === 'active' ? 'suspended' : 'active' }, tokenKey: 'adminToken' });
  load();
}

async function removeTeacher(id) {
  const t = teacherCache.find(x => x._id === id);
  if (!confirm(`Delete ${t ? (t.name || t.teacherId) : 'this teacher'}? This removes the account permanently.`)) return;
  try { await Durabon.api(`/admin/teachers/${id}`, { method: 'DELETE', tokenKey: 'adminToken' }); load(); }
  catch (x) { alert(x.message); }
}

addForm.addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const d = await Durabon.api('/admin/teachers', { method: 'POST', tokenKey: 'adminToken', body: { name: fullName.value, email: email.value, phone: phone.value, className: selectedClass, subject: subject.value } });
    addOut.textContent = `${d.teacher.name} added to ${selectedClass} — ID: ${d.teacher.teacherId} | Password: ${d.teacher.initialPassword}`;
    addForm.reset(); load();
  } catch (x) { addOut.textContent = x.message; }
});

load().catch(() => location.href = 'login.html');
</script>
</body></html>
