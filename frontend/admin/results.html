<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | DURABON</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/enhance.css">
</head><body><header class="header"><a class="brand" href="../index.html"><span class="logo">DA</span><span><b>DURABON</b><small>ADMIN</small></span></a><a class="gold-pill" href="dashboard.html">← Dashboard</a></header>
<main class="section"><p class="kicker">RESULT REVIEW</p><h1>Submitted results</h1><div id="out" style="margin-top:25px"></div></main>
<script src="../js/config.js"></script>
<script src="../js/app.js"></script>
<script>
if (!localStorage.getItem('adminToken')) location.href = 'login.html';
Durabon.api('/admin/results', { tokenKey: 'adminToken' }).then(d => {
  out.innerHTML = '<div class="table-wrap" style="overflow:auto"><table class="result-table" style="width:100%;border-collapse:collapse">' +
    '<tr><th>Student</th><th>Subject</th><th>Class</th><th>Term</th><th>CA1</th><th>CA2</th><th>Exam</th><th>Total</th></tr>' +
    d.map(x => `<tr><td>${x.studentName}</td><td>${x.subject}</td><td>${x.className}</td><td>${x.term}</td><td>${x.ca1}</td><td>${x.ca2}</td><td>${x.exam}</td><td>${x.total}</td></tr>`).join('') +
    '</table></div>';
}).catch(() => location.href = 'login.html');
</script>
</body></html>
